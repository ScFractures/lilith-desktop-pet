<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-n8+jxQQiFpXtbzq1WD+NmksgJ3pcK63X7EQmwa0D1nE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:" />
<title>Lilith</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #scene {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  #bubble {
    position: absolute;
    max-width: 240px;
    width: max-content;
    padding: 7px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.96);
    color: #3a3540;
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
    box-shadow: 0 2px 10px rgba(40, 30, 50, 0.22);
    border: 1px solid rgba(60, 50, 70, 0.08);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    transform: translate(-50%, 4px);
    pointer-events: none;
    white-space: normal;
    overflow-wrap: break-word;
    z-index: 10;
  }
  #bubble.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  #bubble.scroll {
    pointer-events: auto;
  }
  #bubbletext {
    display: block;
  }
  #bubble.scroll #bubbletext {
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #bubbletext::-webkit-scrollbar {
    width: 7px;
  }
  #bubbletext::-webkit-scrollbar-thumb {
    background: rgba(90, 80, 100, 0.28);
    border-radius: 4px;
  }
  #bubbletext::-webkit-scrollbar-thumb:hover {
    background: rgba(90, 80, 100, 0.45);
  }
  #bubbletext::-webkit-scrollbar-track {
    background: transparent;
  }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 9px;
    height: 9px;
    background: rgba(255, 255, 255, 0.96);
    border-right: 1px solid rgba(60, 50, 70, 0.08);
    border-bottom: 1px solid rgba(60, 50, 70, 0.08);
    transform: translateX(-50%) rotate(45deg);
    border-bottom-right-radius: 2px;
  }
  #chatbox {
    position: absolute;
    width: 240px;
    opacity: 0;
    transform: translate(-50%, 6px);
    transition: opacity 0.16s ease, transform 0.16s ease;
    pointer-events: none;
    z-index: 11;
  }
  #chatbox.show {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  #chatinput {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 13px;
    border-radius: 17px;
    border: 1px solid rgba(60, 50, 70, 0.12);
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 2px 12px rgba(40, 30, 50, 0.25);
    font-size: 13px;
    font-family: inherit;
    color: #3a3540;
    outline: none;
  }
  #chatinput::placeholder {
    color: #a8a1ae;
  }
  #chatinput:focus {
    border-color: rgba(255, 93, 126, 0.55);
    box-shadow: 0 2px 12px rgba(40, 30, 50, 0.25), 0 0 0 2px rgba(255, 93, 126, 0.16);
  }
  #zzz {
    position: absolute;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 9;
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(30, 22, 40, 0.55), 0 0 8px rgba(120, 90, 200, 0.4);
    transform: translateX(-50%);
  }
  #zzz.show {
    opacity: 1;
  }
  #zzz span {
    display: inline-block;
    animation: zfloat 2.8s ease-in-out infinite;
  }
  #zzz span:nth-child(2) {
    animation-delay: 0.45s;
    font-size: 1.2em;
  }
  #zzz span:nth-child(3) {
    animation-delay: 0.9s;
    font-size: 1.45em;
  }
  @keyframes zfloat {
    0% { opacity: 0.15; transform: translateY(8px) scale(0.85); }
    35% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-16px) scale(1.05); }
  }
  .heart {
    position: absolute;
    color: #ff5d7e;
    font-size: 16px;
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 9;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -68px) scale(1.0); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/addons/": "../node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="bubble"><div id="bubbletext"></div></div>
  <div id="chatbox"><input id="chatinput" type="text" maxlength="500" placeholder="和莉莉丝说点什么…" spellcheck="false" /></div>
  <div id="zzz"><span>z</span><span>z</span><span>Z</span></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
